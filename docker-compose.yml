services:
  sinyolanda-demo-web:
    build: .
    container_name: sinyolanda-demo-web
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sinyolanda-demo.rule=Host(`sinyolanda-demo.despertartecdigital-ia.com`)"
      - "traefik.http.routers.sinyolanda-demo.entrypoints=websecure"
      - "traefik.http.routers.sinyolanda-demo.tls.certresolver=letsencrypt"
      - "traefik.http.services.sinyolanda-demo.loadbalancer.server.port=80"
    networks:
      - ddtia-net

networks:
  ddtia-net:
    external: true
